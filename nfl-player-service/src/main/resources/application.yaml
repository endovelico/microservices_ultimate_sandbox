server:
  port: 8083

spring:
  application:
    name: nfl-player-service

  kafka:
    bootstrap-servers: kafka:9092  # Use Kafka hostname in Docker/K8s
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: nfl-player-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, env, info, logfile  # Enable recommended Actuator endpoints
  endpoint:
    health:
      show-details: when-authorized             # Full health details only if authenticated
    logfile:
      enabled: true                             # Optional: view logs via /actuator/logfile

resilience4j:

  circuitbreaker:
    instances:
      externalPlayer:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

  retry:
    instances:
      externalPlayer:
        maxAttempts: 3
        waitDuration: 500ms

  bulkhead:
    instances:
      externalPlayer:
        maxConcurrentCalls: 20
        maxWaitDuration: 0